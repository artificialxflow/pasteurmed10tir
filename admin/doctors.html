<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پزشکان | پنل ادمین</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="font-sans antialiased">
  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" class="bg-white border-b-2 border-slate-200 px-4 sm:px-6 py-4"></header>
      <main class="flex-1 p-4 sm:p-6 bg-slate-50">
        <div id="doctors-table" class="mb-8"></div>
        <div class="card-bordered p-6 max-w-lg">
          <h2 class="font-bold mb-4">افزودن پزشک (نمایشی)</h2>
          <form id="add-doctor-form" class="space-y-3">
            <input type="text" class="form-input" placeholder="نام پزشک" id="new-name" required />
            <input type="text" class="form-input" placeholder="تخصص" id="new-specialty" required />
            <button type="submit" class="btn-primary w-full text-sm">افزودن</button>
          </form>
          <p class="text-xs text-slate-400 mt-2">در نسخه نهایی به API متصل می‌شود.</p>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAdminLayout('doctors');
      setAdminTitle('مدیریت پزشکان');

      function render() {
        const rows = PASTEUR_DATA.dentists.map((d) => {
          const st = STATUS_LABELS[d.status];
          return `<tr>
            <td class="px-4 py-3">${d.name}</td>
            <td class="px-4 py-3">${d.specialty}</td>
            <td class="px-4 py-3">${d.days.join('، ')}</td>
            <td class="px-4 py-3">${d.hours}</td>
            <td class="px-4 py-3"><span class="badge ${st.class}">${st.text}</span></td>
          </tr>`;
        }).join('');
        document.getElementById('doctors-table').innerHTML = renderDataTable(
          ['نام', 'تخصص', 'روزها', 'ساعات', 'وضعیت'],
          rows
        );
      }
      render();

      document.getElementById('add-doctor-form').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('پزشک «' + document.getElementById('new-name').value + '» ثبت شد. (نسخه نمایشی)');
        e.target.reset();
      });
    });
  </script>
</body>
</html>
