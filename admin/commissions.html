<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پورسانت‌ها | پنل ادمین</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="font-sans antialiased">
  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" class="bg-white border-b-2 border-slate-200 px-4 sm:px-6 py-4"></header>
      <main class="flex-1 p-4 sm:p-6 bg-slate-50">
        <div id="commission-summary" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8"></div>
        <div id="commissions-table"></div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    function renderCommissions() {
      const commissions = PasteurStorage.getCommissions();
      const total = commissions.reduce((sum, c) => sum + (c.commissionAmount || 0), 0);
      const paid = commissions.filter((c) => c.status === 'paid').reduce((sum, c) => sum + (c.commissionAmount || 0), 0);
      const pending = total - paid;

      document.getElementById('commission-summary').innerHTML = `
        <div class="card-bordered p-5"><p class="text-2xl font-bold text-teal-700">${total.toLocaleString('fa-IR')}</p><p class="text-sm text-slate-500">کل پورسانت</p></div>
        <div class="card-bordered p-5"><p class="text-2xl font-bold text-green-700">${paid.toLocaleString('fa-IR')}</p><p class="text-sm text-slate-500">پرداخت‌شده</p></div>
        <div class="card-bordered p-5"><p class="text-2xl font-bold text-amber-700">${pending.toLocaleString('fa-IR')}</p><p class="text-sm text-slate-500">در انتظار</p></div>`;

      const rows = commissions.map((c) => `
        <tr>
          <td class="px-4 py-3">${c.visitorName}</td>
          <td class="px-4 py-3 font-mono">${c.referralCode}</td>
          <td class="px-4 py-3">${c.sourceLabel}</td>
          <td class="px-4 py-3">${c.customerName}</td>
          <td class="px-4 py-3">${c.amount.toLocaleString('fa-IR')}</td>
          <td class="px-4 py-3">${c.commissionRate}%</td>
          <td class="px-4 py-3 font-bold text-teal-700">${c.commissionAmount.toLocaleString('fa-IR')}</td>
          <td class="px-4 py-3"><span class="badge ${c.status === 'paid' ? 'badge-available' : 'badge-busy'}">${c.status === 'paid' ? 'پرداخت‌شده' : 'در انتظار'}</span></td>
          <td class="px-4 py-3">${c.status !== 'paid' ? `<button class="pay-commission text-xs font-semibold text-teal-700" data-id="${c.id}">تسویه</button>` : '—'}</td>
        </tr>
      `).join('');

      document.getElementById('commissions-table').innerHTML = renderDataTable(
        ['ویزیتور', 'کد', 'منبع', 'مشتری', 'مبلغ', 'درصد', 'پورسانت', 'وضعیت', 'عملیات'],
        rows,
        'پورسانتی ثبت نشده است.'
      );
    }

    document.addEventListener('DOMContentLoaded', () => {
      mountAdminLayout('commissions');
      setAdminTitle('گزارش پورسانت ویزیتورها');
      renderCommissions();

      document.getElementById('commissions-table').addEventListener('click', (e) => {
        if (!e.target.classList.contains('pay-commission')) return;
        PasteurStorage.updateCommission(e.target.dataset.id, { status: 'paid' });
        renderCommissions();
      });
    });
  </script>
</body>
</html>
