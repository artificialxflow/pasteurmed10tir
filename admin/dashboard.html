<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>داشبورد | پنل ادمین</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="font-sans antialiased">
  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" class="bg-white border-b-2 border-slate-200 px-4 sm:px-6 py-4"></header>
      <main class="flex-1 p-4 sm:p-6 bg-slate-50">
        <div class="flex flex-wrap gap-2 mb-6" id="date-filter">
          <button data-filter="day" class="filter-btn badge badge-available cursor-pointer">امروز</button>
          <button data-filter="week" class="filter-btn badge bg-slate-100 text-slate-700 border-slate-300 cursor-pointer">هفته</button>
          <button data-filter="month" class="filter-btn badge bg-slate-100 text-slate-700 border-slate-300 cursor-pointer">ماه</button>
        </div>
        <div id="kpi-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>
        <h2 class="font-bold text-lg mb-4">رزروهای اخیر</h2>
        <div id="recent-bookings"></div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAdminLayout('dashboard');
      setAdminTitle('داشبورد آمار');

      function render(filter = 'day') {
        const stats = PasteurStorage.getBookingStats();
        document.getElementById('kpi-grid').innerHTML = `
          <div class="card-bordered p-5"><p class="text-2xl font-bold text-teal-700">${stats.totalBookings}</p><p class="text-sm text-slate-500">کل رزروها</p></div>
          <div class="card-bordered p-5"><p class="text-2xl font-bold text-blue-700">${stats.todayVisitors}</p><p class="text-sm text-slate-500">مراجعین امروز</p></div>
          <div class="card-bordered p-5"><p class="text-2xl font-bold text-amber-700">${stats.revenue.toLocaleString('fa-IR')}</p><p class="text-sm text-slate-500">درآمد (تومان)</p></div>
          <div class="card-bordered p-5"><p class="text-2xl font-bold text-purple-700">${stats.activeMembers}</p><p class="text-sm text-slate-500">عضویت فعال</p></div>`;

        const rows = stats.recentBookings.map((b) => `
          <tr class="hover:bg-slate-50">
            <td class="px-4 py-3">${b.patientName || '—'}</td>
            <td class="px-4 py-3">${b.doctorName || '—'}</td>
            <td class="px-4 py-3">${b.typeLabel || '—'}</td>
            <td class="px-4 py-3">${b.day || ''} ${b.timeLabel || ''}</td>
            <td class="px-4 py-3"><span class="badge ${b.status === 'confirmed' ? 'badge-available' : b.status === 'cancelled' ? 'badge-inactive' : 'badge-busy'}">${b.status === 'confirmed' ? 'تأیید' : b.status === 'cancelled' ? 'لغو' : 'در انتظار'}</span></td>
          </tr>`).join('');

        document.getElementById('recent-bookings').innerHTML = renderDataTable(
          ['مراجع', 'پزشک', 'نوع', 'زمان', 'وضعیت'],
          rows,
          'هنوز رزروی ثبت نشده است.'
        );
      }

      render();
      document.getElementById('date-filter').addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach((b) => {
          b.className = 'filter-btn badge bg-slate-100 text-slate-700 border-slate-300 cursor-pointer';
        });
        btn.className = 'filter-btn badge badge-available cursor-pointer';
        render(btn.dataset.filter);
      });
    });
  </script>
</body>
</html>
