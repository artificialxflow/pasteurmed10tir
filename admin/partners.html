<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>درخواست‌های همکاری | پنل ادمین</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="font-sans antialiased">
  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" class="bg-white border-b-2 border-slate-200 px-4 sm:px-6 py-4"></header>
      <main class="flex-1 p-4 sm:p-6 bg-slate-50">
        <div id="partners-table"></div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    const statusLabels = {
      new: { label: 'جدید', className: 'badge-busy' },
      reviewing: { label: 'در حال بررسی', className: 'bg-blue-100 text-blue-800 border-blue-300' },
      approved: { label: 'تایید شده', className: 'badge-available' },
      rejected: { label: 'رد شده', className: 'badge-inactive' },
    };

    function renderPartners() {
      const rows = PasteurStorage.getPartnerRequests().map((request) => {
        const status = statusLabels[request.status] || statusLabels.new;
        return `
          <tr>
            <td class="px-4 py-3">${request.name || '—'}<br/><span class="text-xs text-slate-500">${request.phone || '—'}</span></td>
            <td class="px-4 py-3">${request.typeLabel || '—'}</td>
            <td class="px-4 py-3">${request.specialty || '—'}</td>
            <td class="px-4 py-3">${request.city || '—'}</td>
            <td class="px-4 py-3 text-xs max-w-xs truncate">${request.description || '—'}</td>
            <td class="px-4 py-3"><span class="badge ${status.className}">${status.label}</span></td>
            <td class="px-4 py-3">
              <select class="partner-status form-input text-xs py-1" data-id="${request.id}">
                <option value="new" ${request.status === 'new' ? 'selected' : ''}>جدید</option>
                <option value="reviewing" ${request.status === 'reviewing' ? 'selected' : ''}>در حال بررسی</option>
                <option value="approved" ${request.status === 'approved' ? 'selected' : ''}>تایید شده</option>
                <option value="rejected" ${request.status === 'rejected' ? 'selected' : ''}>رد شده</option>
              </select>
            </td>
          </tr>`;
      }).join('');

      document.getElementById('partners-table').innerHTML = renderDataTable(
        ['متقاضی', 'نوع همکاری', 'تخصص', 'شهر', 'توضیحات', 'وضعیت', 'عملیات'],
        rows,
        'هنوز درخواست همکاری ثبت نشده است.'
      );
    }

    document.addEventListener('DOMContentLoaded', () => {
      mountAdminLayout('partners');
      setAdminTitle('درخواست‌های همکاری');
      renderPartners();

      document.getElementById('partners-table').addEventListener('change', (event) => {
        const select = event.target.closest('.partner-status');
        if (!select) return;
        PasteurStorage.updatePartnerRequest(select.dataset.id, { status: select.value });
        renderPartners();
      });
    });
  </script>
</body>
</html>
