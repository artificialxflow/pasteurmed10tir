<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>یادآورها | پنل ادمین</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="font-sans antialiased">
  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" class="bg-white border-b-2 border-slate-200 px-4 sm:px-6 py-4"></header>
      <main class="flex-1 p-4 sm:p-6 bg-slate-50">
        <div id="reminders-table"></div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAdminLayout('reminders');
      setAdminTitle('یادآورهای هوشمند');
      const rows = PasteurStorage.getReminders().map((r) => `
        <tr>
          <td class="px-4 py-3">${r.patientName}</td>
          <td class="px-4 py-3">${r.patientPhone}</td>
          <td class="px-4 py-3">${r.doctorName}</td>
          <td class="px-4 py-3">${r.day} ${r.timeLabel}</td>
          <td class="px-4 py-3">${r.optionLabel}</td>
          <td class="px-4 py-3"><span class="badge ${r.status === 'active' ? 'badge-available' : 'badge-inactive'}">${r.status === 'active' ? 'فعال' : 'غیرفعال'}</span></td>
        </tr>`).join('');
      document.getElementById('reminders-table').innerHTML = renderDataTable(
        ['مراجع', 'موبایل', 'پزشک', 'زمان نوبت', 'یادآور', 'وضعیت'],
        rows,
        'یادآوری ثبت نشده.'
      );
    });
  </script>
</body>
</html>
