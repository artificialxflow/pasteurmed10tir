<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ویزیتورها | پنل ادمین</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="font-sans antialiased">
  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" class="bg-white border-b-2 border-slate-200 px-4 sm:px-6 py-4"></header>
      <main class="flex-1 p-4 sm:p-6 bg-slate-50">
        <div id="visitors-table" class="mb-8"></div>

        <div class="card-bordered p-6 max-w-xl">
          <h2 class="font-bold mb-4">افزودن ویزیتور / معرف</h2>
          <form id="add-visitor-form" class="space-y-3">
            <input type="text" class="form-input" id="visitor-name" placeholder="نام ویزیتور" required />
            <input type="text" class="form-input" id="visitor-code" placeholder="کد معرف مثل PLUS300" required />
            <input type="tel" class="form-input" id="visitor-phone" placeholder="شماره تماس" />
            <input type="number" class="form-input" id="visitor-rate" placeholder="درصد پورسانت" value="5" min="0" max="100" />
            <button type="submit" class="btn-primary w-full text-sm">ثبت ویزیتور</button>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    function renderVisitors() {
      const rows = PasteurStorage.getVisitors().map((v, i) => `
        <tr>
          <td class="px-4 py-3">${v.name}</td>
          <td class="px-4 py-3 font-mono font-bold text-teal-700">${v.code}</td>
          <td class="px-4 py-3">${v.phone || '—'}</td>
          <td class="px-4 py-3">${v.commissionRate}%</td>
          <td class="px-4 py-3"><span class="badge ${v.status === 'active' ? 'badge-available' : 'badge-inactive'}">${v.status === 'active' ? 'فعال' : 'غیرفعال'}</span></td>
          <td class="px-4 py-3">
            <button class="toggle-visitor text-xs font-semibold text-teal-700" data-idx="${i}">${v.status === 'active' ? 'غیرفعال' : 'فعال'}</button>
          </td>
        </tr>
      `).join('');
      document.getElementById('visitors-table').innerHTML = renderDataTable(
        ['نام', 'کد معرف', 'تماس', 'پورسانت', 'وضعیت', 'عملیات'],
        rows,
        'ویزیتوری ثبت نشده است.'
      );
    }

    document.addEventListener('DOMContentLoaded', () => {
      mountAdminLayout('visitors');
      setAdminTitle('مدیریت ویزیتورها و کد معرف');
      renderVisitors();

      document.getElementById('add-visitor-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const visitors = PasteurStorage.getVisitors();
        visitors.push({
          id: Date.now(),
          name: document.getElementById('visitor-name').value.trim(),
          code: document.getElementById('visitor-code').value.trim().toUpperCase(),
          phone: document.getElementById('visitor-phone').value.trim(),
          commissionRate: Number(document.getElementById('visitor-rate').value || 0),
          status: 'active',
        });
        PasteurStorage.saveVisitors(visitors);
        renderVisitors();
        e.target.reset();
      });

      document.getElementById('visitors-table').addEventListener('click', (e) => {
        if (!e.target.classList.contains('toggle-visitor')) return;
        const visitors = PasteurStorage.getVisitors();
        const idx = Number(e.target.dataset.idx);
        visitors[idx].status = visitors[idx].status === 'active' ? 'inactive' : 'active';
        PasteurStorage.saveVisitors(visitors);
        renderVisitors();
      });
    });
  </script>
</body>
</html>
