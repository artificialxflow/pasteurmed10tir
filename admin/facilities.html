<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسهیلات تجهیزات | پنل ادمین</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="font-sans antialiased">
  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" class="bg-white border-b-2 border-slate-200 px-4 sm:px-6 py-4"></header>
      <main class="flex-1 p-4 sm:p-6 bg-slate-50">
        <div id="facilities-table"></div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    function renderFacilities() {
      const rows = PasteurStorage.getFacilityRequests().map((r) => `
        <tr>
          <td class="px-4 py-3">${r.name || '—'}</td>
          <td class="px-4 py-3">${r.phone || '—'}</td>
          <td class="px-4 py-3">${r.amount || '—'}</td>
          <td class="px-4 py-3 text-xs max-w-xs truncate">${r.description || '—'}</td>
          <td class="px-4 py-3"><span class="badge ${r.status === 'approved' ? 'badge-available' : 'badge-busy'}">${r.status === 'approved' ? 'تأیید شده' : 'در بررسی'}</span></td>
        </tr>
      `).join('');

      document.getElementById('facilities-table').innerHTML = renderDataTable(
        ['نام', 'موبایل', 'مبلغ تقریبی', 'توضیحات', 'وضعیت'],
        rows,
        'درخواست تسهیلاتی ثبت نشده است.'
      );
    }

    document.addEventListener('DOMContentLoaded', () => {
      mountAdminLayout('facilities');
      setAdminTitle('درخواست‌های تسهیلات تجهیزات');
      renderFacilities();
    });
  </script>
</body>
</html>
