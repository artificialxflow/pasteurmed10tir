<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فروشگاه | پنل ادمین</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="font-sans antialiased">
  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" class="bg-white border-b-2 border-slate-200 px-4 sm:px-6 py-4"></header>
      <main class="flex-1 p-4 sm:p-6 bg-slate-50">
        <div id="shop-summary" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>
        <h2 class="font-bold text-lg mb-4">سفارش‌های فروشگاه</h2>
        <div id="orders-table" class="mb-8"></div>
        <h2 class="font-bold text-lg mb-4">محصولات فروشگاه</h2>
        <div id="products-table" class="mb-8"></div>
        <div class="card-bordered p-6 max-w-3xl bg-white">
          <h2 class="font-bold mb-4">افزودن محصول</h2>
          <form id="add-product-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input type="text" class="form-input" placeholder="نام محصول" id="prod-name" required />
            <input type="text" class="form-input" placeholder="قیمت نمایشی مثل ۱,۲۰۰,۰۰۰" id="prod-price" required />
            <select class="form-input" id="prod-cat">
              <option>دندانپزشکی</option>
              <option>پزشکی</option>
            </select>
            <input type="number" class="form-input" placeholder="موجودی" id="prod-stock" value="10" />
            <input type="url" class="form-input sm:col-span-2" placeholder="آدرس تصویر محصول" id="prod-image" />
            <button type="submit" class="btn-primary w-full text-sm sm:col-span-2">افزودن محصول</button>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script>
    function formatPrice(num) {
      return Number(num || 0).toLocaleString('fa-IR');
    }

    function parsePrice(value) {
      const normalized = String(value || '')
        .replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
        .replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
      return Number(normalized.replace(/[^\d]/g, '')) || 0;
    }

    function renderSummary() {
      PasteurStorage.initProductsIfNeeded();
      const products = PasteurStorage.getProducts();
      const orders = PasteurStorage.getShopOrders();
      const revenue = orders.reduce((sum, order) => sum + Number(order.total || 0), 0);
      const lowStock = products.filter((product) => Number(product.stock || 0) <= 3).length;
      const pending = orders.filter((order) => order.status === 'pending').length;

      document.getElementById('shop-summary').innerHTML = `
        <div class="card-bordered p-5"><p class="text-2xl font-bold text-teal-700">${products.length.toLocaleString('fa-IR')}</p><p class="text-sm text-slate-500">محصول فعال</p></div>
        <div class="card-bordered p-5"><p class="text-2xl font-bold text-blue-700">${orders.length.toLocaleString('fa-IR')}</p><p class="text-sm text-slate-500">کل سفارش‌ها</p></div>
        <div class="card-bordered p-5"><p class="text-2xl font-bold text-amber-700">${pending.toLocaleString('fa-IR')}</p><p class="text-sm text-slate-500">سفارش در انتظار</p></div>
        <div class="card-bordered p-5"><p class="text-2xl font-bold text-rose-700">${formatPrice(revenue)}</p><p class="text-sm text-slate-500">مبلغ سفارش‌ها</p></div>
        ${lowStock ? `<div class="card-bordered p-4 col-span-full bg-amber-50 border-amber-200 text-sm text-amber-800">⚠️ ${lowStock.toLocaleString('fa-IR')} محصول موجودی پایین دارد.</div>` : ''}`;
    }

    function renderOrders() {
      const rows = PasteurStorage.getShopOrders().map((order) => `
        <tr>
          <td class="px-4 py-3 font-mono text-xs">${order.id}</td>
          <td class="px-4 py-3">${order.customerName || '—'}<br/><span class="text-xs text-slate-500">${order.customerPhone || '—'}</span></td>
          <td class="px-4 py-3">${order.customerTypeLabel || '—'}</td>
          <td class="px-4 py-3 text-xs">${(order.items || []).map((item) => `${item.name} × ${item.qty}`).join('، ') || '—'}</td>
          <td class="px-4 py-3 font-bold text-teal-700">${formatPrice(order.total)} تومان</td>
          <td class="px-4 py-3">
            <select class="order-status form-input text-xs py-1" data-id="${order.id}">
              <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>در انتظار</option>
              <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>در حال پیگیری</option>
              <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>تکمیل شده</option>
              <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>لغو شده</option>
            </select>
          </td>
        </tr>
      `).join('');

      document.getElementById('orders-table').innerHTML = renderDataTable(
        ['کد سفارش', 'مشتری', 'نوع', 'اقلام', 'مبلغ', 'وضعیت'],
        rows,
        'هنوز سفارشی ثبت نشده است.'
      );
    }

    function renderProducts() {
      PasteurStorage.initProductsIfNeeded();
      const products = PasteurStorage.getProducts();
      const rows = products.map((p, i) => `
        <tr>
          <td class="px-4 py-3">
            <div class="flex items-center gap-3">
              <img src="${p.image}" class="w-12 h-12 rounded-xl object-cover border border-slate-200" alt="" />
              <span class="font-bold">${p.name}</span>
            </div>
          </td>
          <td class="px-4 py-3">${p.category}</td>
          <td class="px-4 py-3">${p.price} تومان</td>
          <td class="px-4 py-3"><span class="badge ${Number(p.stock || 0) > 3 ? 'badge-available' : Number(p.stock || 0) > 0 ? 'badge-busy' : 'badge-inactive'}">${Number(p.stock || 0).toLocaleString('fa-IR')}</span></td>
          <td class="px-4 py-3">
            <button class="text-red-600 text-xs delete-prod" data-idx="${i}">حذف</button>
          </td>
        </tr>`).join('');
      document.getElementById('products-table').innerHTML = renderDataTable(
        ['محصول', 'دسته', 'قیمت', 'موجودی', 'عملیات'],
        rows
      );
      renderSummary();
    }

    document.addEventListener('DOMContentLoaded', () => {
      mountAdminLayout('shop');
      setAdminTitle('مدیریت فروشگاه');
      renderProducts();
      renderOrders();

      document.getElementById('add-product-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const products = PasteurStorage.getProducts();
        const price = document.getElementById('prod-price').value.trim();
        products.push({
          id: Date.now(),
          name: document.getElementById('prod-name').value.trim(),
          price,
          priceNum: parsePrice(price),
          category: document.getElementById('prod-cat').value,
          stock: parseInt(document.getElementById('prod-stock').value, 10),
          image: document.getElementById('prod-image').value.trim() || 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=400&h=300&fit=crop',
        });
        PasteurStorage.saveProducts(products);
        renderProducts();
        e.target.reset();
      });

      document.getElementById('products-table').addEventListener('click', (e) => {
        if (e.target.classList.contains('delete-prod')) {
          const products = PasteurStorage.getProducts();
          products.splice(parseInt(e.target.dataset.idx, 10), 1);
          PasteurStorage.saveProducts(products);
          renderProducts();
        }
      });

      document.getElementById('orders-table').addEventListener('change', (e) => {
        if (!e.target.classList.contains('order-status')) return;
        PasteurStorage.updateShopOrder(e.target.dataset.id, { status: e.target.value });
        renderOrders();
        renderSummary();
      });
    });
  </script>
</body>
</html>
