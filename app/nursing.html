<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>پرستاری | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <p class="app-intro">خدمات پرستاری در منزل — شامل مراقبت ICU/CCU</p>
      <div id="nursing-grid"></div>
      <a id="nursing-call" href="#" class="btn-primary app-w-full app-block app-text-center app-mt-4">تماس برای درخواست</a>
      <a href="consultation.html?category=nursing&type=phone" class="app-link-web">ثبت درخواست آنلاین</a>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/app-components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'home', title: 'پرستاری', backHref: appHref('index.html') });
      document.getElementById('nursing-grid').innerHTML = PASTEUR_DATA.nursingServices.map((s) => `
        <div class="app-tile">
          <span class="app-tile-emoji">${s.emoji}</span>
          <p class="app-tile-title">${s.title}</p>
          <p class="app-tile-desc">${s.description || ''}</p>
          <p class="app-tile-price">${s.price || ''}</p>
        </div>`).join('');
      document.getElementById('nursing-call').href = `tel:${PASTEUR_DATA.institute.phoneDigits}`;
    });
  </script>
</body>
</html>
