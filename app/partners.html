<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>همکاری | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <form id="partner-form" class="space-y-3">
        <input type="text" id="partner-name" class="form-input" placeholder="نام" required />
        <input type="tel" id="partner-phone" class="form-input" placeholder="موبایل" required />
        <select id="partner-type" class="form-input"><option value="nurse">پرستار</option><option value="dentist">دندانپزشک</option><option value="doctor">پزشک</option><option value="psychologist">روانشناس</option></select>
        <input type="text" id="partner-specialty" class="form-input" placeholder="تخصص" />
        <input type="text" id="partner-city" class="form-input" placeholder="شهر" />
        <textarea id="partner-notes" class="form-input min-h-[80px]" placeholder="توضیحات"></textarea>
        <button type="submit" class="btn-primary w-full">ارسال درخواست</button>
      </form>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/app-components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'home', title: 'همکاری', backHref: appHref('index.html') });
      document.getElementById('partner-form').addEventListener('submit', (e) => {
        e.preventDefault();
        PasteurStorage.savePartnerRequest({ id: PasteurStorage.generateId(), name: document.getElementById('partner-name').value, phone: document.getElementById('partner-phone').value, type: document.getElementById('partner-type').value, specialty: document.getElementById('partner-specialty').value, city: document.getElementById('partner-city').value, notes: document.getElementById('partner-notes').value, status: 'pending', createdAt: new Date().toISOString() });
        showAppSnackbar('درخواست همکاری ثبت شد');
        e.target.reset();
      });
    });
  </script>
</body>
</html>
