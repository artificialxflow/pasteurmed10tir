<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0891b2" />
  <title>پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter" data-app-page="home">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main id="app-main" class="app-main">
      <section class="app-hero">
        <p style="font-size:.75rem;opacity:.9">خوش آمدید</p>
        <p class="app-hero-title" style="font-size:1.35rem;font-weight:800;margin:.35rem 0 0">پاستور پلاس</p>
        <p style="font-size:.82rem;opacity:.9;margin-top:.5rem;line-height:1.6">دندانپزشکی، پزشکی، پرستاری و تجهیزات در یک اپ</p>
      </section>
      <p style="font-weight:800;font-size:.92rem;color:#334155;margin:0 0 .65rem">خدمات اصلی</p>
      <div class="app-grid-2" id="app-services"></div>
      <p style="font-weight:800;font-size:.92rem;color:#334155;margin:1rem 0 .65rem">دسترسی سریع</p>
      <div id="app-quick"></div>
      <div id="app-web-link"></div>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar" aria-live="polite"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app-components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'home', title: 'پاستور پلاس' });
      setAppViewPreference(true);
      const services = [
        { emoji: '🦷', title: 'دندانپزشکی', desc: 'رزرو نوبت', href: appHref('dental/index.html') },
        { emoji: '🩺', title: 'پزشکی', desc: 'مشاوره و ویزیت', href: appHref('medical.html') },
        { emoji: '🛒', title: 'تجهیزات', desc: 'فروشگاه', href: appHref('shop.html') },
        { emoji: '🎁', title: 'باشگاه', desc: 'امتیاز و پاداش', href: appHref('club.html') },
      ];
      document.getElementById('app-services').innerHTML = services.map((s) => renderAppTile(s)).join('');
      const quick = [
        { emoji: '💬', title: 'مشاوره و ویزیت', href: appHref('consultation.html') },
        { emoji: '👩‍⚕️', title: 'پرستاری در منزل', href: appHref('nursing.html') },
        { emoji: '📞', title: 'تماس با ما', href: appHref('contact.html') },
        { emoji: '🤝', title: 'درخواست همکاری', href: appHref('partners.html') },
      ];
      document.getElementById('app-quick').innerHTML = quick.map((q) => renderAppTile({ ...q, desc: '' })).join('');
      document.getElementById('app-web-link').innerHTML = appWebVersionLink();
    });
  </script>
</body>
</html>
