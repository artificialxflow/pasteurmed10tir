<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>تخصص‌ها | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main"><div id="specialty-grid"></div></main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../../js/data.js"></script>
  <script src="../../js/app-components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'consultation', title: 'تخصص‌های پزشکی', backHref: appHref('medical.html') });
      document.getElementById('specialty-grid').innerHTML = PASTEUR_DATA.medicalSpecialties.map((s) => `
        <a href="${appHref(`consultation.html?category=medical-specialty&specialty=${s.id}&type=video`)}" class="app-tile">
          <span style="font-size:1.75rem">${s.emoji}</span>
          <p style="font-weight:800;margin:.4rem 0 0">${s.name}</p>
          <p style="font-size:.72rem;color:#64748b;margin:.25rem 0 0">${s.description}</p>
        </a>`).join('');
    });
  </script>
</body>
</html>
