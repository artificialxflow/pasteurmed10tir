<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>پزشکی | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <p class="app-intro">مسیر پزشکی مورد نیاز را انتخاب کنید</p>
      <a href="consultation.html?category=medical&type=text" class="app-tile">
        <span class="app-tile-emoji">👨‍⚕️</span>
        <p class="app-tile-title">پزشکی عمومی</p>
        <p class="app-tile-desc">شروع درخواست</p>

      <a href="medical/specialty.html" class="app-tile">
        <span class="app-tile-emoji">🔬</span>
        <p class="app-tile-title">تخصص‌ها</p>
        <p class="app-tile-desc">درخواست ویزیت تخصصی</p>
      </a>
      <a href="consultation.html?category=medical-home&type=phone" class="app-tile">
        <span class="app-tile-emoji">🏠</span>
        <p class="app-tile-title">ویزیت در منزل</p>
        <p class="app-tile-desc">درخواست ویزیت منزل</p>
      </a>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../js/app-components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'home', title: 'بخش پزشکی', backHref: appHref('index.html') });
    });
  </script>
</body>
