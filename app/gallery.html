<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>گالری | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <section class="app-hero app-mb-3">
        <p class="app-hero-title" style="font-size:1rem">🖼️ گالری نتایج</p>
        <p class="app-hero-sub">نمونه‌کارهای قبل و بعد — دندان، لیزر و زیبایی</p>
      </section>
      <div id="gallery-filters" class="app-gallery-filters"></div>
      <div id="gallery-grid"></div>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>

  <div id="lightbox" class="app-lightbox hidden">
    <div class="app-lightbox-inner">
      <button type="button" id="lightbox-close" class="app-lightbox-close" aria-label="بستن">✕</button>
      <h3 id="lightbox-title" class="app-font-bold app-text-center app-mb-3" style="font-size:1rem;margin-top:1.5rem"></h3>
      <div class="app-grid app-grid-cols-2 app-gap-2-grid">
        <div>
          <p class="app-text-xs app-text-muted app-text-center app-mb-2">قبل</p>
          <img id="lightbox-before" alt="قبل" style="width:100%;height:9rem;object-fit:cover;border-radius:.5rem;border:2px solid #e2e8f0" />
        </div>
        <div>
          <p class="app-text-xs app-text-muted app-text-center app-mb-2">بعد</p>
          <img id="lightbox-after" alt="بعد" style="width:100%;height:9rem;object-fit:cover;border-radius:.5rem;border:2px solid #99f6e4" />
        </div>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app-components.js"></script>
  <script>
    const catLabels = { dental: 'دندانپزشکی', laser: 'لیزر', beauty: 'زیبایی' };

    function renderGallery(cat = 'all') {
      PasteurStorage.initGalleryIfNeeded();
      let items = PasteurStorage.getGallery();
      if (cat !== 'all') items = items.filter((g) => g.category === cat);

      document.getElementById('gallery-grid').innerHTML = items.length
        ? items.map((g) => `
          <article class="app-card app-gallery-card gallery-card" data-id="${g.id}" style="padding:0;overflow:hidden">
            <div class="app-grid app-grid-cols-2" style="gap:2px">
              <img src="${g.before}" alt="قبل" loading="lazy" style="width:100%;height:5.5rem;object-fit:cover" />
              <img src="${g.after}" alt="بعد" loading="lazy" style="width:100%;height:5.5rem;object-fit:cover" />
            </div>
            <div style="padding:.65rem">
              <span class="badge badge-available app-text-xs">${catLabels[g.category] || g.category}</span>
              <p class="app-font-bold app-text-sm app-mt-2" style="margin:.35rem 0 0">${g.title}</p>
              <p class="app-text-xs app-text-muted">کلیک برای بزرگنمایی</p>
            </div>
          </article>`).join('')
        : '<p class="app-empty">موردی یافت نشد</p>';
    }

    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'home', title: 'گالری نتایج', backHref: appHref('index.html') });

      document.getElementById('gallery-filters').innerHTML = PASTEUR_DATA.galleryCategories.map((c, i) => `
        <button type="button" data-cat="${c.id}" class="gallery-filter badge ${i === 0 ? 'badge-available' : ''}" style="${i === 0 ? '' : 'background:#f1f5f9'}">${c.label}</button>`).join('');

      renderGallery();

      document.getElementById('gallery-filters').addEventListener('click', (e) => {
        const btn = e.target.closest('.gallery-filter');
        if (!btn) return;
        document.querySelectorAll('.gallery-filter').forEach((b) => {
          b.classList.remove('badge-available');
          b.style.background = '#f1f5f9';
        });
        btn.classList.add('badge-available');
        btn.style.background = '';
        renderGallery(btn.dataset.cat);
      });

      document.getElementById('gallery-grid').addEventListener('click', (e) => {
        const card = e.target.closest('.gallery-card');
        if (!card) return;
        const item = PasteurStorage.getGallery().find((g) => g.id === parseInt(card.dataset.id, 10));
        if (!item) return;
        document.getElementById('lightbox-title').textContent = item.title;
        document.getElementById('lightbox-before').src = item.before;
        document.getElementById('lightbox-after').src = item.after;
        document.getElementById('lightbox').classList.remove('hidden');
      });

      document.getElementById('lightbox-close').addEventListener('click', () => {
        document.getElementById('lightbox').classList.add('hidden');
      });
      document.getElementById('lightbox').addEventListener('click', (e) => {
        if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.add('hidden');
      });
    });
  </script>
</body>
</html>
