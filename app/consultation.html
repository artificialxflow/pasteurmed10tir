<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>مشاوره و ویزیت | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter" data-app-page="consultation">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <form id="consultation-form" class="space-y-4">
        <div><label class="form-label">نوع مشاوره</label><div id="type-options" class="grid grid-cols-2 gap-2"></div></div>
        <div><label class="form-label">دسته خدمت</label><select id="category" class="form-input" required></select></div>
        <div id="specialty-field" class="hidden"><label class="form-label">تخصص</label><input type="text" id="c-specialty" class="form-input bg-slate-50" readonly /></div>
        <div><label class="form-label">نام</label><input type="text" id="c-name" class="form-input" required /></div>
        <div><label class="form-label">موبایل</label><input type="tel" id="c-phone" class="form-input" required /></div>
        <div><label class="form-label">شرح مشکل</label><textarea id="c-desc" class="form-input min-h-[100px]" required></textarea></div>
        <div id="estimate-preview" class="card-bordered p-4 bg-teal-50 hidden text-sm"><p id="estimate-service"></p><p id="estimate-price" class="font-bold text-teal-700 mt-1"></p></div>
        <button type="submit" class="btn-primary w-full">ثبت درخواست</button>
      </form>
      <div id="success-msg" class="hidden card-bordered p-6 bg-green-50 text-center mt-4"><p class="text-2xl">✅</p><p class="font-bold text-green-800">درخواست ثبت شد</p></div>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app-components.js"></script>
  <script>
    const consultationParams = new URLSearchParams(window.location.search);
    const requestedType = consultationParams.get('type');
    const requestedSpecialty = consultationParams.get('specialty');
    let selectedType = ['text', 'image', 'video', 'phone'].includes(requestedType) ? requestedType : 'text';
    const selectedSpecialty = PASTEUR_DATA.medicalSpecialties.find((s) => s.id === requestedSpecialty) || null;
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'consultation', title: 'مشاوره و ویزیت', backHref: appHref('index.html') });
      document.getElementById('type-options').innerHTML = PASTEUR_DATA.consultationTypes.map((t) => `
        <button type="button" data-type="${t.id}" class="type-btn app-tile text-center ${t.id === selectedType ? 'border-teal-500' : ''}">
          <span>${t.emoji}</span><p class="text-xs font-bold mt-1">${t.label}</p>
        </button>`).join('');
      document.getElementById('category').innerHTML = PASTEUR_DATA.consultationCategories.map((c) => `<option value="${c.id}">${c.label}</option>`).join('');
      const requestedCategory = consultationParams.get('category');
      if (PASTEUR_DATA.consultationCategories.some((c) => c.id === requestedCategory)) document.getElementById('category').value = requestedCategory;
      if (selectedSpecialty) { document.getElementById('specialty-field').classList.remove('hidden'); document.getElementById('c-specialty').value = selectedSpecialty.name; }
      function updateEstimate() {
        const cat = PASTEUR_DATA.consultationCategories.find((c) => c.id === document.getElementById('category').value);
        if (!cat) return;
        document.getElementById('estimate-service').textContent = cat.service + (selectedSpecialty ? ` — ${selectedSpecialty.name}` : '');
        document.getElementById('estimate-price').textContent = cat.estimate;
        document.getElementById('estimate-preview').classList.remove('hidden');
      }
      updateEstimate();
      document.getElementById('category').addEventListener('change', updateEstimate);
      document.getElementById('type-options').addEventListener('click', (e) => {
        const btn = e.target.closest('.type-btn'); if (!btn) return;
        selectedType = btn.dataset.type;
        document.querySelectorAll('.type-btn').forEach((b) => b.classList.remove('border-teal-500'));
        btn.classList.add('border-teal-500');
      });
      document.getElementById('consultation-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const cat = PASTEUR_DATA.consultationCategories.find((c) => c.id === document.getElementById('category').value);
        const type = PASTEUR_DATA.consultationTypes.find((t) => t.id === selectedType);
        PasteurStorage.saveConsultation({ id: PasteurStorage.generateId(), type: selectedType, typeLabel: type?.label, category: document.getElementById('category').value, categoryLabel: cat?.label, specialty: selectedSpecialty?.id || null, specialtyLabel: selectedSpecialty?.name || null, name: document.getElementById('c-name').value, phone: document.getElementById('c-phone').value, description: document.getElementById('c-desc').value, estimate: cat?.estimate, status: 'pending', createdAt: new Date().toISOString() });
        PasteurStorage.addClubPoints(document.getElementById('c-phone').value, 20, 'مشاوره و ویزیت');
        document.getElementById('consultation-form').classList.add('hidden');
        document.getElementById('success-msg').classList.remove('hidden');
        showAppSnackbar('درخواست با موفقیت ثبت شد');
      });
    });
  </script>
</body>
</html>
