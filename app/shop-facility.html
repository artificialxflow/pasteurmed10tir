<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>تسهیلات VIP | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <section class="app-hero app-mb-3">
        <p class="app-hero-title" style="font-size:1rem">تسهیلات تجهیزات</p>
        <p class="app-hero-sub">فقط برای مشتریان VIP</p>
      </section>
      <div id="vip-gate" class="app-card app-mb-4 app-hidden">
        <p class="app-text-sm">برای درخواست تسهیلات ابتدا VIP تجهیزات را فعال کنید.</p>
        <a href="shop-vip.html" class="btn-primary app-w-full app-block app-text-center app-mt-3">فعال‌سازی VIP</a>
      </div>
      <form id="facility-form" class="app-form-stack app-hidden">
        <ul id="terms" class="app-text-xs app-text-muted app-mb-3" style="padding-right:1rem"></ul>
        <input type="text" id="fac-name" class="form-input" placeholder="نام" required />
        <input type="tel" id="fac-phone" class="form-input" placeholder="موبایل" required />
        <input type="number" id="fac-amount" class="form-input" placeholder="مبلغ درخواستی (تومان)" min="1000000" required />
        <textarea id="fac-note" class="form-input app-min-h-textarea" placeholder="توضیحات / نام تجهیز"></textarea>
        <button type="submit" class="btn-primary app-w-full">ثبت درخواست</button>
      </form>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app-components.js"></script>
  <script src="../js/app-shop.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'shop', title: 'تسهیلات', backHref: appHref('shop-catalog.html') });
      document.getElementById('terms').innerHTML = PASTEUR_DATA.shopVip.facilityTerms.map((t) => `<li>${t}</li>`).join('');
      const phone = AppShop.getVipPhone();
      const isVip = AppShop.getCustomerType() === 'vip' && PasteurStorage.isShopVip(phone);
      if (isVip) {
        document.getElementById('facility-form').classList.remove('app-hidden');
        if (phone) document.getElementById('fac-phone').value = phone;
      } else {
        document.getElementById('vip-gate').classList.remove('app-hidden');
      }
      document.getElementById('facility-form').addEventListener('submit', (e) => {
        e.preventDefault();
        PasteurStorage.saveFacilityRequest({
          id: PasteurStorage.generateId(),
          name: document.getElementById('fac-name').value.trim(),
          phone: document.getElementById('fac-phone').value.trim(),
          amount: document.getElementById('fac-amount').value.trim(),
          description: document.getElementById('fac-note').value.trim(),
          status: 'pending',
          createdAt: new Date().toISOString(),
        });
        showAppSnackbar('درخواست ثبت شد');
        e.target.reset();
        if (phone) document.getElementById('fac-phone').value = phone;
      });
    });
  </script>
</body>
</html>
