<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>لیزر | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <p class="app-intro">خدمات لیزر و زیبایی</p>
      <div id="laser-grid"></div>
      <div class="app-card app-text-center app-mt-4">
        <p class="app-mb-3">برای مشاوره و رزرو تماس بگیرید</p>
        <a id="laser-call" href="#" class="btn-accent app-w-full app-block">تماس برای رزرو</a>
        <a href="consultation.html?category=laser&type=video" class="app-link-web">ثبت درخواست مشاوره آنلاین</a>
      </div>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/app-components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'home', title: 'لیزر و زیبایی', backHref: appHref('index.html') });
      document.getElementById('laser-grid').innerHTML = PASTEUR_DATA.laserServices.map((s) => `
        <div class="app-tile">
          <span class="app-tile-emoji">${s.emoji}</span>
          <p class="app-tile-title">${s.title}</p>
          <p class="app-tile-price">${s.price}</p>
        </div>`).join('');
      document.getElementById('laser-call').href = `tel:${PASTEUR_DATA.institute.phoneDigits}`;
    });
  </script>
</body>
</html>
