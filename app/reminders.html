<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>یادآور | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <p class="app-intro">یادآور نوبت — ۲۴ ساعت و ۲ ساعت قبل (نسخه نمایشی)</p>
      <div class="app-card app-card--info app-mb-4">
        برای دریافت اعلان، اجازه نوتیفیکیشن را فعال کنید.
        <button type="button" id="enable-notify" class="app-block app-font-bold app-mt-2 app-text-teal" style="background:none;border:none;padding:0">فعال‌سازی اعلان</button>
      </div>
      <div id="add-reminder-section" class="app-card app-hidden app-mb-4">
        <p class="app-font-bold app-mb-2">ثبت یادآور برای آخرین رزرو</p>
        <div id="last-booking-info" class="app-text-sm app-text-muted app-mb-3"></div>
        <div id="reminder-options" class="app-form-stack-sm app-mb-3"></div>
        <button type="button" id="save-reminder" class="btn-primary app-w-full">ثبت یادآور</button>
      </div>
      <p class="app-section-title">یادآورهای فعال</p>
      <div id="reminders-list"></div>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/reminders.js"></script>
  <script src="../js/app-components.js"></script>
  <script>
    let selectedOption = '24h';
    function renderReminders() {
      const list = PasteurStorage.getReminders();
      document.getElementById('reminders-list').innerHTML = list.length
        ? list.map((r) => ReminderService.renderReminderCard(r)).join('')
        : '<p class="app-empty">یادآوری ثبت نشده است</p>';
    }
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'home', title: 'یادآور هوشمند', backHref: appHref('index.html') });
      document.getElementById('enable-notify').addEventListener('click', async () => {
        const result = await ReminderService.requestPermission();
        showAppSnackbar(result === 'granted' ? 'اعلان‌ها فعال شد' : 'اجازه داده نشد');
      });
      const lastRaw = sessionStorage.getItem('pasteur_last_booking');
      const lastBooking = lastRaw ? JSON.parse(lastRaw) : PasteurStorage.getLastBooking();
      if (lastBooking) {
        document.getElementById('add-reminder-section').classList.remove('app-hidden');
        document.getElementById('last-booking-info').innerHTML = `${lastBooking.doctorName} — ${lastBooking.day} ${lastBooking.timeLabel}`;
        document.getElementById('reminder-options').innerHTML = PASTEUR_DATA.reminderOptions.map((o) => `
          <label class="app-tile app-flex app-items-center app-gap-2" style="margin:0;cursor:pointer">
            <input type="radio" name="reminder" value="${o.id}" ${o.id === '24h' ? 'checked' : ''} />
            <span class="app-font-bold app-text-sm">${o.label}</span>
          </label>`).join('');
        document.getElementById('reminder-options').addEventListener('change', (e) => {
          if (e.target.name === 'reminder') selectedOption = e.target.value;
        });
        document.getElementById('save-reminder').addEventListener('click', async () => {
          await ReminderService.requestPermission();
          ReminderService.createFromBooking(lastBooking, selectedOption);
          sessionStorage.removeItem('pasteur_last_booking');
          document.getElementById('add-reminder-section').classList.add('app-hidden');
          renderReminders();
          showAppSnackbar('یادآور ثبت شد');
        });
      }
      renderReminders();
      document.getElementById('reminders-list').addEventListener('click', (e) => {
        const btn = e.target.closest('.delete-reminder');
        if (btn && confirm('یادآور حذف شود؟')) {
          PasteurStorage.deleteReminder(btn.dataset.id);
          renderReminders();
          showAppSnackbar('یادآور حذف شد');
        }
      });
    });
  </script>
</body>
</html>
