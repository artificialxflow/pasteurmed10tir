<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>باشگاه | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter" data-app-page="club">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <div class="app-flex app-gap-2 app-mb-4">
        <input type="tel" id="club-phone" class="form-input app-flex-1" placeholder="شماره موبایل" />
        <button type="button" id="club-load" class="btn-primary app-shrink-0">بررسی</button>
      </div>
      <div id="club-dashboard" class="app-hidden">
        <div class="app-grid-2 app-mb-4">
          <div class="app-tile app-text-center"><p id="club-points" class="app-stat-value">۰</p><p class="app-stat-label">امتیاز</p></div>
          <div class="app-tile app-text-center"><p id="club-visits" class="app-stat-value">۰</p><p class="app-stat-label">مراجعه</p></div>
          <div class="app-tile app-text-center"><p id="club-referrals" class="app-stat-value">۰</p><p class="app-stat-label">معرفی</p></div>
          <div class="app-tile app-text-center"><p id="club-tier" class="app-font-bold app-text-sm" style="margin:0">—</p><p class="app-stat-label">سطح</p></div>
        </div>
        <p class="app-section-title">پاداش‌ها</p>
        <div id="rewards-grid" class="app-mb-4"></div>
        <p class="app-section-title">ماموریت‌ها</p>
        <div id="missions-list" class="app-form-stack-sm app-mb-4"></div>
        <p class="app-section-title">تاریخچه امتیاز</p>
        <div id="history-list" class="app-form-stack-sm app-mb-4"></div>
        <p id="invite-code" class="app-card app-text-sm app-font-bold" style="color:#b45309;background:#fffbeb"></p>
      </div>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app-components.js"></script>
  <script>
    let currentPhone = '';
    function loadClub(phone) {
      const digits = phone.replace(/[^\d]/g, '');
      if (digits.length < 10) { showAppSnackbar('شماره موبایل معتبر نیست'); return; }
      currentPhone = digits;
      const profile = PasteurStorage.getClubProfile(digits);
      const tier = PasteurStorage.getClubTier(profile.points);
      document.getElementById('club-dashboard').classList.remove('app-hidden');
      document.getElementById('club-points').textContent = profile.points.toLocaleString('fa-IR');
      document.getElementById('club-visits').textContent = (profile.visits || 0).toLocaleString('fa-IR');
      document.getElementById('club-referrals').textContent = (profile.referrals || 0).toLocaleString('fa-IR');
      document.getElementById('club-tier').textContent = `${tier.emoji} ${tier.name}`;
      document.getElementById('invite-code').textContent = `کد دعوت: PLUS-${digits.slice(-4)}`;
      document.getElementById('rewards-grid').innerHTML = PASTEUR_DATA.clubRewards.map((r) => {
        const can = profile.points >= r.points;
        return `<div class="app-tile app-flex app-justify-between app-items-center">
          <div><p class="app-font-bold" style="margin:0">${r.emoji} ${r.title}</p><p class="app-tile-desc">${r.points} امتیاز</p></div>
          <button type="button" class="redeem-btn btn-primary app-text-xs app-shrink-0" data-id="${r.id}" ${can ? '' : 'disabled'}>دریافت</button>
        </div>`;
      }).join('');
      document.getElementById('missions-list').innerHTML = PASTEUR_DATA.clubMissions.map((m) =>
        `<div class="app-card app-text-sm"><p class="app-font-bold" style="margin:0">${m.title}</p><p class="app-text-teal app-mt-2">${m.reward}</p></div>`).join('');
      document.getElementById('history-list').innerHTML = profile.history.length
        ? profile.history.slice(0, 8).map((h) => `<div class="app-card app-flex app-justify-between app-text-sm"><span>${h.reason}</span><span class="app-font-bold ${h.points >= 0 ? 'app-text-teal' : ''}">${h.points >= 0 ? '+' : ''}${h.points}</span></div>`).join('')
        : '<p class="app-empty">هنوز امتیازی ثبت نشده</p>';
    }
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'club', title: 'باشگاه', backHref: appHref('index.html') });
      document.getElementById('club-load').addEventListener('click', () => loadClub(document.getElementById('club-phone').value));
      document.getElementById('rewards-grid').addEventListener('click', (e) => {
        const btn = e.target.closest('.redeem-btn');
        if (!btn || btn.disabled) return;
        const reward = PASTEUR_DATA.clubRewards.find((r) => r.id === parseInt(btn.dataset.id, 10));
        const profile = PasteurStorage.getClubProfile(currentPhone);
        profile.points -= reward.points;
        profile.history.unshift({ points: -reward.points, reason: `دریافت: ${reward.title}`, date: new Date().toISOString() });
        PasteurStorage.saveClubProfile(currentPhone, profile);
        showAppSnackbar(`پاداش «${reward.title}» فعال شد`);
        loadClub(currentPhone);
      });
    });
  </script>
</body>
</html>
