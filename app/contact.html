<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>تماس | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main" id="contact-main">
      <section class="app-hero app-mb-3">
        <p class="app-hero-kicker">کانال‌های ارتباطی</p>
        <p class="app-hero-title" style="font-size:1.1rem">تماس با ما</p>
        <p class="app-hero-sub">هماهنگی نوبت، پرستاری، فروشگاه، مشاوره و عضویت</p>
      </section>
      <div id="contact-cards" class="app-form-stack-sm app-mb-4"></div>
      <div class="app-card app-mb-4">
        <p class="app-font-bold app-mb-2">🕐 ساعات پاسخگویی</p>
        <p id="contact-hours" class="app-text-sm app-text-muted"></p>
      </div>
      <div class="app-card app-mb-4">
        <p class="app-font-bold app-mb-2">📍 آدرس درمانگاه</p>
        <p id="address-text" class="app-text-sm app-text-muted"></p>
        <p id="service-area" class="app-text-xs app-text-muted app-mt-2"></p>
      </div>
      <div class="app-grid app-grid-cols-2 app-gap-2-grid">
        <a id="quick-call" href="#" class="btn-primary app-text-center app-text-sm" style="padding:.65rem">تماس فوری</a>
        <a id="quick-whatsapp" href="#" class="btn-accent app-text-center app-text-sm" style="padding:.65rem">واتساپ</a>
      </div>
      <a href="partners.html" class="app-link-web app-mt-3 app-block app-text-center">درخواست همکاری</a>
    </main>
    <div id="app-nav"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/app-components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'home', title: 'تماس با ما', backHref: appHref('index.html') });
      const i = PASTEUR_DATA.institute;
      const whatsappUrl = `https://wa.me/${i.whatsappDigits}`;

      document.getElementById('contact-cards').innerHTML = `
        <a href="tel:${i.phoneDigits}" class="app-tile app-block">
          <p class="app-font-bold">📞 ${i.phone}</p>
          <p class="app-tile-desc">تماس اصلی — درمانگاه</p>
        </a>
        <a href="tel:${i.phoneAltDigits}" class="app-tile app-block">
          <p class="app-font-bold">☎️ ${i.phoneAlt}</p>
          <p class="app-tile-desc">تماس دوم — پیگیری خدمات</p>
        </a>
        <a href="${whatsappUrl}" class="app-tile app-block" target="_blank" rel="noopener">
          <p class="app-font-bold">💬 واتساپ</p>
          <p class="app-tile-desc">${i.whatsapp}</p>
        </a>`;

      document.getElementById('contact-hours').textContent = i.contactHours;
      document.getElementById('address-text').textContent = i.address;
      document.getElementById('service-area').textContent = 'محدوده خدمات: ' + i.serviceArea;
      document.getElementById('quick-call').href = `tel:${i.phoneDigits}`;
      document.getElementById('quick-whatsapp').href = whatsappUrl;
    });
  </script>
</body>
</html>
