<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>سفارش ثبت شد | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main app-text-center">
      <div class="app-card app-mb-4" style="padding:2rem 1rem">
        <p style="font-size:3rem;margin:0">✅</p>
        <h1 class="app-font-bold app-mt-3" style="font-size:1.1rem">سفارش ثبت شد</h1>
        <p class="app-text-sm app-text-muted app-mt-2">کارشناس فروش به‌زودی با شما تماس می‌گیرد.</p>
        <p id="order-total" class="app-tile-price app-mt-4"></p>
      </div>
      <a href="shop-catalog.html" class="btn-primary app-w-full app-block app-text-center app-mb-3">ادامه خرید</a>
      <a href="index.html" class="app-link-web">بازگشت به خانه</a>
    </main>
    <div id="app-nav"></div>
  </div>
  <script src="../js/app-components.js"></script>
  <script src="../js/app-shop.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'shop', title: 'تأیید سفارش', backHref: appHref('index.html'), showNav: true });
      const total = sessionStorage.getItem('pasteur_last_shop_order_total');
      if (total) {
        document.getElementById('order-total').textContent = Number(total).toLocaleString('fa-IR') + ' تومان';
      }
    });
  </script>
</body>
</html>
