<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>آموزش | دندان | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <p class="app-intro">آموزش‌های بعد از خدمات دندانپزشکی</p>
      <div id="courses-list"></div>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../../js/data.js"></script>
  <script src="../../js/app-components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'dental', title: 'آموزش دندان', backHref: appHref('dental/index.html') });
      document.getElementById('courses-list').innerHTML = PASTEUR_DATA.educationCourses.map((c) => `
        <article class="app-card">
          <p class="app-font-bold">${c.title}</p>
          <span class="badge badge-available app-text-xs">${c.level}</span>
          <p class="app-text-teal app-text-sm app-mt-2">▶ ${c.duration}</p>
          <p class="app-text-muted app-text-sm app-mt-2">${c.description}</p>
        </article>`).join('');
    });
  </script>
</body>
</html>
