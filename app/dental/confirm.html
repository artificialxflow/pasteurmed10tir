<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>تأیید پرداخت | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <div id="payment-summary" class="app-mb-4"></div>
      <button id="btn-pay" class="btn-primary app-w-full app-mb-2">پرداخت موفق (نمایشی)</button>
      <button id="btn-fail" class="app-btn-danger app-w-full">پرداخت ناموفق</button>
    </main>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../../js/data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/payment.js"></script>
  <script src="../../js/app-components.js"></script>
  <script src="../../js/app-shop.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pending = PasteurStorage.getPendingPayment();
      const backHref = pending?.returnTo || appHref('dental/general.html');
      mountAppLayout({ page: 'dental', title: 'تأیید پرداخت', backHref, showNav: false });
      PaymentFlow.init();
    });
  </script>
</body>
</html>
