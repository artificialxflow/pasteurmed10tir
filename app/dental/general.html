<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>رزرو دندان | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/app.css" />
</head>
<body class="app-body app-page-enter" data-app-page="dental">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <input type="search" id="doctor-search" class="form-input mb-4" placeholder="جستجوی نام پزشک..." />
      <div id="doctors-list"></div>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../../js/data.js"></script>
  <script src="../../js/app-components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'dental', title: 'دندانپزشکان', backHref: appHref('dental/index.html') });
      const list = document.getElementById('doctors-list');
      function render(filter = '') {
        const filtered = PASTEUR_DATA.dentists.filter((d) => d.name.includes(filter.trim()));
        list.innerHTML = filtered.length ? filtered.map((d) => `
          <a href="booking.html?doctor=${d.id}" class="app-tile" style="display:flex;gap:.75rem;align-items:center">
            <img src="${d.image}" alt="" style="width:3.5rem;height:3.5rem;border-radius:1rem;object-fit:cover" />
            <div><p style="font-weight:800;margin:0">${d.name}</p><p style="font-size:.75rem;color:#0e7490;margin:.15rem 0 0">${d.specialty}</p></div>
          </a>`).join('') : '<p class="app-empty">پزشکی یافت نشد</p>';
      }
      render();
      document.getElementById('doctor-search').addEventListener('input', (e) => render(e.target.value));
    });
  </script>
</body>
</html>
