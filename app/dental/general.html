<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>رزرو دندان | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/app.css" />
</head>
<body class="app-body app-page-enter" data-app-page="dental">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <section class="app-hero app-mb-3">
        <p class="app-hero-title" style="font-size:1rem">دندانپزشکان مرکز</p>
        <p class="app-hero-sub">دندانپزشک مورد نظر را انتخاب کنید</p>
      </section>
      <input type="search" id="doctor-search" class="form-input app-mb-4" placeholder="جستجوی نام پزشک..." />
      <div id="doctors-list"></div>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../../js/data.js"></script>
  <script src="../../js/app-components.js"></script>
  <script>
    const DOCTOR_STATUS = {
      available: { text: 'آزاد', class: 'badge-available' },
      busy: { text: 'مشغول', class: 'badge-busy' },
      inactive: { text: 'غیرفعال', class: 'badge-inactive' },
    };

    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'dental', title: 'دندانپزشکان', backHref: appHref('dental/index.html') });
      const list = document.getElementById('doctors-list');

      function render(filter = '') {
        const filtered = PASTEUR_DATA.dentists.filter((d) => d.name.includes(filter.trim()));
        list.innerHTML = filtered.length
          ? filtered.map((d) => {
            const status = DOCTOR_STATUS[d.status] || DOCTOR_STATUS.inactive;
            const inactive = d.status === 'inactive';
            const inner = `
              <img src="${d.image}" alt="" class="app-doctor-thumb" />
              <div class="app-flex-1">
                <div class="app-flex app-items-center app-gap-2" style="flex-wrap:wrap">
                  <p class="app-tile-title" style="margin:0">${d.name}</p>
                  <span class="badge app-text-xs ${status.class}">${status.text}</span>
                </div>
                <p class="app-tile-desc">${d.specialty}</p>
                <div class="app-doctor-meta">
                  <span>📅 ${(d.days || []).join('، ')}</span>
                  <span>🕐 ${d.hours || '—'}</span>
                </div>
              </div>`;
            return inactive
              ? `<div class="app-tile app-tile--row" style="opacity:.55">${inner}</div>`
              : `<a href="booking.html?doctor=${d.id}" class="app-tile app-tile--row">${inner}</a>`;
          }).join('')
          : '<p class="app-empty">پزشکی یافت نشد</p>';
      }

      render();
      document.getElementById('doctor-search').addEventListener('input', (e) => render(e.target.value));
    });
  </script>
</body>
</html>
