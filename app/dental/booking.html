<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>رزرو نوبت | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main" id="app-main">
      <div id="booking-app">
        <div id="selected-doctor-info" class="app-hidden app-mb-3"></div>
        <div id="booking-progress" class="app-flex app-gap-2 app-mb-4 app-text-xs"></div>
        <div id="booking-error" class="app-hidden app-mb-3 app-text-sm" style="padding:.75rem;border-radius:.75rem;color:#b91c1c;background:#fef2f2"></div>
        <div id="step-type" class="booking-step"><div id="type-options" class="app-grid app-grid-cols-2 app-gap-2-grid"></div></div>
        <div id="step-doctor" class="booking-step hidden"><div id="doctor-list" class="app-form-stack-sm"></div></div>
        <div id="step-day" class="booking-step hidden"><div id="day-options" class="app-flex app-gap-2" style="flex-wrap:wrap"></div></div>
        <div id="step-time" class="booking-step hidden">
          <p id="time-hint" class="app-text-xs app-mb-2 app-card app-card--info"></p>
          <div id="time-options" class="app-grid app-grid-cols-3 app-gap-2-grid"></div>
        </div>
        <div id="step-info" class="booking-step hidden">
          <div id="booking-summary" class="app-mb-4 app-text-sm"></div>
          <form id="booking-form" class="app-form-stack-sm">
            <input type="text" id="patient-name" class="form-input" placeholder="نام و نام خانوادگی" required />
            <input type="tel" id="patient-phone" class="form-input" placeholder="موبایل" required />
            <input type="text" id="referral-code" class="form-input" placeholder="کد معرف (اختیاری)" />
            <button type="submit" id="btn-submit" class="btn-primary app-w-full hidden">تأیید</button>
          </form>
        </div>
        <div class="app-flex app-gap-2 app-mt-4">
          <button type="button" id="btn-back" class="app-flex-1" style="padding:.5rem;border-radius:.75rem;border:1px solid var(--app-outline);background:#fff">قبلی</button>
          <button type="button" id="btn-next" class="btn-primary app-flex-1">بعدی</button>
        </div>
      </div>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../../js/data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/booking.js"></script>
  <script src="../../js/app-components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'dental', title: 'رزرو نوبت', backHref: appHref('dental/general.html'), showNav: false });
      BookingFlow.init();
    });
  </script>
</body>
</html>
