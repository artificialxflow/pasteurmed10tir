<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>تخصص | دندان | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main"><div id="specialty-grid"></div></main>
    <div id="app-nav"></div>
  </div>
  <script src="../../js/data.js"></script>
  <script src="../../js/app-components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'dental', title: 'تخصص دندان', backHref: appHref('dental/index.html') });
      document.getElementById('specialty-grid').innerHTML = PASTEUR_DATA.dentalSpecialties.map((s) => `
        <a href="general.html" class="app-tile">
          <span class="app-tile-emoji">${s.emoji}</span>
          <p class="app-tile-title">${s.name}</p>
          <p class="app-tile-desc">${s.description}</p>
        </a>`).join('');
    });
  </script>
</body>
</html>
