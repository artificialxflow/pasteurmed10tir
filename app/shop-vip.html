<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VIP تجهیزات | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <section class="app-hero app-mb-3" style="background:linear-gradient(145deg,#fff7ed,#fff)">
        <p class="app-hero-title" style="font-size:1.1rem">💎 VIP تجهیزات</p>
        <p class="app-hero-sub" id="vip-desc"></p>
      </section>
      <div id="vip-active" class="app-card app-hidden app-mb-4">
        <p class="app-font-bold app-text-teal app-mb-2">عضویت VIP فعال است</p>
        <p class="app-text-sm app-text-muted app-mb-3" id="vip-phone-label"></p>
        <a href="shop-catalog.html" class="btn-primary app-w-full app-block app-text-center">رفتن به محصولات</a>
      </div>
      <form id="vip-form" class="app-form-stack">
        <p class="app-section-title">فعال‌سازی VIP</p>
        <p class="app-text-sm app-text-muted">هزینه عضویت: <strong id="vip-price"></strong> تومان</p>
        <input type="text" id="vip-name" class="form-input" placeholder="نام و نام خانوادگی" required />
        <input type="tel" id="vip-phone" class="form-input" placeholder="شماره موبایل" required />
        <input type="text" id="vip-referral" class="form-input" placeholder="کد معرف ویزیتور (اختیاری)" />
        <ul id="vip-terms" class="app-text-xs app-text-muted" style="padding-right:1rem"></ul>
        <div class="app-grid app-grid-cols-2 app-gap-2-grid">
          <button type="button" id="check-vip" class="btn-accent app-w-full">قبلاً VIP هستم</button>
          <button type="submit" class="btn-primary app-w-full">پرداخت VIP</button>
        </div>
      </form>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app-components.js"></script>
  <script src="../js/app-shop.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'shop', title: 'VIP تجهیزات', backHref: appHref('shop.html') });
      const vip = PASTEUR_DATA.shopVip;
      document.getElementById('vip-desc').textContent = vip.facilityTitle;
      document.getElementById('vip-price').textContent = vip.price;
      document.getElementById('vip-terms').innerHTML = vip.facilityTerms.map((t) => `<li>${t}</li>`).join('');

      const phoneInput = document.getElementById('vip-phone');
      const saved = AppShop.getVipPhone();
      if (saved) phoneInput.value = saved;

      function showActive(phone) {
        AppShop.setCustomerType('vip', phone);
        document.getElementById('vip-active').classList.remove('app-hidden');
        document.getElementById('vip-form').classList.add('app-hidden');
        document.getElementById('vip-phone-label').textContent = 'موبایل: ' + phone;
      }

      if (PasteurStorage.isShopVip(saved)) showActive(saved);

      document.getElementById('check-vip').addEventListener('click', () => {
        const phone = phoneInput.value.trim();
        if (phone.replace(/[^\d]/g, '').length < 10) {
          showAppSnackbar('شماره موبایل را وارد کنید');
          return;
        }
        if (PasteurStorage.isShopVip(phone)) {
          showActive(phone);
          showAppSnackbar('VIP فعال — در حال انتقال...');
          setTimeout(() => { window.location.href = appHref('shop-catalog.html'); }, 800);
        } else {
          showAppSnackbar('برای این شماره VIP فعال نیست');
        }
      });

      document.getElementById('vip-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('vip-name').value.trim();
        const phone = phoneInput.value.trim();
        if (name.length < 2 || phone.replace(/[^\d]/g, '').length < 10) {
          showAppSnackbar('نام و موبایل را کامل وارد کنید');
          return;
        }
        PasteurStorage.setPendingPayment({
          planId: 'shop-vip',
          planName: vip.planName,
          amount: vip.priceNum,
          amountToman: vip.priceNum,
          patientName: name,
          patientPhone: phone,
          referralCode: document.getElementById('vip-referral').value.trim().toUpperCase(),
          successTo: appHref('shop-catalog.html?vip=paid'),
          returnTo: appHref('shop-vip.html'),
        });
        window.location.href = appHref('dental/confirm.html');
      });
    });
  </script>
</body>
</html>
