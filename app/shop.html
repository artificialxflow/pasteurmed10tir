<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>فروشگاه | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-body app-page-enter" data-app-page="shop">
  <div class="app-device">
    <div id="app-chrome"></div>
    <main class="app-main">
      <section class="app-hero app-mb-3">
        <p class="app-hero-title" style="font-size:1.1rem">فروشگاه تجهیزات</p>
        <p class="app-hero-sub">انتخاب نوع مشتری برای شروع خرید</p>
      </section>
      <div id="customer-types"></div>
    </main>
    <div id="app-nav"></div>
    <div id="app-snackbar" class="app-snackbar"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app-components.js"></script>
  <script src="../js/app-shop.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAppLayout({ page: 'shop', title: 'فروشگاه', backHref: appHref('index.html') });
      document.getElementById('customer-types').innerHTML = PASTEUR_DATA.shopCustomerTypes.map((t) => `
        <button type="button" data-type="${t.id}" class="app-tile app-w-full app-text-right" style="width:100%;border:none;cursor:pointer;${t.id === 'vip' ? 'background:linear-gradient(145deg,#fff7ed,#fff)' : ''}">
          <span class="app-tile-emoji">${t.emoji}</span>
          <p class="app-tile-title">${t.title}</p>
          <p class="app-tile-desc">${t.description}</p>
          <ul class="app-text-xs app-text-muted app-mt-2" style="padding-right:1rem;margin:0">${t.benefits.map((b) => `<li>${b}</li>`).join('')}</ul>
        </button>`).join('');

      document.getElementById('customer-types').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-type]');
        if (!btn) return;
        if (btn.dataset.type === 'regular') {
          AppShop.setCustomerType('regular');
          window.location.href = appHref('shop-catalog.html');
        } else {
          window.location.href = appHref('shop-vip.html');
        }
      });
    });
  </script>
</body>
</html>
