<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>یادآور هوشمند | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body data-page="reminders" class="flex flex-col min-h-screen font-sans antialiased">
  <div id="site-header"></div>
  <main class="flex-1 py-10">
    <div class="max-w-2xl mx-auto px-4 sm:px-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">🔔 یادآور هوشمند</h1>
      <p class="text-slate-600 mb-6">یادآور نوبت‌های خود را مدیریت کنید — اعلان مرورگر و پیامک (نسخه نمایشی)</p>

      <div class="card-bordered p-4 mb-6 bg-blue-50 border-blue-200 text-sm text-blue-800">
        برای دریافت اعلان، اجازه نوتیفیکیشن مرورگر را فعال کنید.
        <button type="button" id="enable-notify" class="block mt-2 text-blue-700 font-semibold underline">فعال‌سازی اعلان</button>
      </div>

      <div id="add-reminder-section" class="card-bordered p-6 mb-8 hidden">
        <h2 class="font-bold mb-4">ثبت یادآور برای آخرین رزرو</h2>
        <div id="last-booking-info" class="text-sm text-slate-600 mb-4"></div>
        <label class="form-label">زمان یادآور</label>
        <div id="reminder-options" class="space-y-2 mb-4"></div>
        <button type="button" id="save-reminder" class="btn-primary w-full">ثبت یادآور</button>
      </div>

      <h2 class="font-bold text-lg mb-4">یادآورهای فعال</h2>
      <div id="reminders-list" class="space-y-3"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/reminders.js"></script>
  <script src="../js/components.js"></script>
  <script>
    let selectedOption = '24h';

    function renderReminders() {
      const list = PasteurStorage.getReminders();
      const el = document.getElementById('reminders-list');
      el.innerHTML = list.length
        ? list.map((r) => ReminderService.renderReminderCard(r)).join('')
        : '<p class="text-slate-500 text-center py-8 card-bordered">یادآوری ثبت نشده است.</p>';
    }

    document.addEventListener('DOMContentLoaded', () => {
      mountLayout('reminders');

      document.getElementById('enable-notify').addEventListener('click', async () => {
        const result = await ReminderService.requestPermission();
        alert(result === 'granted' ? 'اعلان‌ها فعال شد!' : result === 'denied' ? 'اجازه رد شد.' : 'مرورگر پشتیبانی نمی‌کند.');
      });

      const lastRaw = sessionStorage.getItem('pasteur_last_booking');
      const lastBooking = lastRaw ? JSON.parse(lastRaw) : PasteurStorage.getLastBooking();

      if (lastBooking) {
        document.getElementById('add-reminder-section').classList.remove('hidden');
        document.getElementById('last-booking-info').innerHTML = `
          <strong>${lastBooking.doctorName}</strong> — ${lastBooking.typeLabel}<br/>
          ${lastBooking.day} — ${lastBooking.timeLabel}`;

        document.getElementById('reminder-options').innerHTML = PASTEUR_DATA.reminderOptions.map((o) => `
          <label class="flex items-center gap-3 card-bordered p-3 cursor-pointer reminder-opt ${o.id === '24h' ? 'border-teal-500 bg-teal-50' : ''}">
            <input type="radio" name="reminder" value="${o.id}" class="accent-teal-600" ${o.id === '24h' ? 'checked' : ''} />
            <span class="font-medium">${o.label}</span>
          </label>
        `).join('');

        document.getElementById('reminder-options').addEventListener('change', (e) => {
          if (e.target.name === 'reminder') {
            selectedOption = e.target.value;
            document.querySelectorAll('.reminder-opt').forEach((l) => l.classList.remove('border-teal-500', 'bg-teal-50'));
            e.target.closest('.reminder-opt')?.classList.add('border-teal-500', 'bg-teal-50');
          }
        });

        document.getElementById('save-reminder').addEventListener('click', async () => {
          await ReminderService.requestPermission();
          ReminderService.createFromBooking(lastBooking, selectedOption);
          sessionStorage.removeItem('pasteur_last_booking');
          document.getElementById('add-reminder-section').classList.add('hidden');
          renderReminders();
          alert('یادآور با موفقیت ثبت شد!');
        });
      }

      renderReminders();

      document.getElementById('reminders-list').addEventListener('click', (e) => {
        const btn = e.target.closest('.delete-reminder');
        if (btn && confirm('یادآور حذف شود؟')) {
          PasteurStorage.deleteReminder(btn.dataset.id);
          renderReminders();
        }
      });
    });
  </script>
</body>
</html>
