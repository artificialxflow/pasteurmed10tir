<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحصیلات | دندانپزشکی — پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-page="dental" class="flex flex-col min-h-screen font-sans antialiased">
  <div id="site-header"></div>
  <main class="flex-1 py-10">
    <div class="max-w-3xl mx-auto px-4 sm:px-6">
      <nav class="text-sm text-slate-500 mb-6">
        <a href="index.html" class="hover:text-teal-700">دندانپزشکی</a>
        <span class="mx-2">/</span>
        <span class="text-slate-900 font-medium">تحصیلات</span>
      </nav>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">📚 دوره‌ها و تحصیلات</h1>
      <p class="text-slate-600 mb-8">دوره‌های آموزشی و گواهینامه‌های پاستور پلاس</p>
      <div id="courses-list" class="space-y-5"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../../js/data.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountLayout('dental');
      document.getElementById('courses-list').innerHTML = PASTEUR_DATA.educationCourses.map((c) => `
        <article class="card-bordered p-6">
          <div class="flex flex-wrap items-center gap-2 mb-2">
            <h2 class="font-bold text-lg">${c.title}</h2>
            <span class="badge badge-available">${c.level}</span>
          </div>
          <p class="text-sm text-teal-700 font-medium mb-2">⏱ ${c.duration}</p>
          <p class="text-slate-600 text-sm leading-relaxed">${c.description}</p>
        </article>
      `).join('');
    });
  </script>
</body>
</html>
