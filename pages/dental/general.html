<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دندانپزشکان | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-page="dental" class="flex flex-col min-h-screen font-sans antialiased">
  <div id="site-header"></div>
  <main class="flex-1 py-10">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      <nav class="text-sm text-slate-500 mb-6">
        <a href="../../index.html" class="hover:text-teal-700">صفحه اصلی</a>
        <span class="mx-2">/</span>
        <a href="index.html" class="hover:text-teal-700">دندانپزشکی</a>
        <span class="mx-2">/</span>
        <span class="text-slate-900 font-medium">عمومی</span>
      </nav>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">دندانپزشکان مرکز</h1>
      <p class="text-slate-600 mb-6">دندانپزشک مورد نظر را انتخاب کنید</p>

      <div class="mb-6">
        <label for="doctor-search" class="form-label">جستجو بر اساس نام</label>
        <input type="search" id="doctor-search" class="form-input" placeholder="نام پزشک را وارد کنید..." />
      </div>

      <div id="doctors-list" class="space-y-4"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../../js/data.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountLayout('dental');
      const list = document.getElementById('doctors-list');
      const search = document.getElementById('doctor-search');
      const base = '../../';

      function renderList(filter = '') {
        const filtered = PASTEUR_DATA.dentists.filter((d) =>
          d.name.includes(filter.trim())
        );
        list.innerHTML = filtered.length
          ? filtered.map((d) => renderDoctorCard(d, base)).join('')
          : '<p class="text-slate-500 text-center py-8 card-bordered">دندانپزشکی یافت نشد.</p>';
      }

      renderList();
      search.addEventListener('input', (e) => renderList(e.target.value));
    });
  </script>
</body>
</html>
