<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تخصصی | دندانپزشکی — موسسه پاستور</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-page="dental" class="flex flex-col min-h-screen font-sans antialiased">
  <div id="site-header"></div>
  <main class="flex-1 py-10">
    <div class="max-w-5xl mx-auto px-4 sm:px-6">
      <nav class="text-sm text-slate-500 mb-6">
        <a href="index.html" class="hover:text-teal-700">دندانپزشکی</a>
        <span class="mx-2">/</span>
        <span class="text-slate-900 font-medium">تخصصی</span>
      </nav>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">🔬 خدمات تخصصی دندانپزشکی</h1>
      <p class="text-slate-600 mb-8">تخصص مورد نظر را انتخاب کنید و نوبت رزرو کنید</p>
      <div id="specialty-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      <div class="text-center mt-8">
        <a href="general.html" class="btn-primary">رزرو نوبت با پزشک</a>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../../js/data.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountLayout('dental');
      document.getElementById('specialty-grid').innerHTML = PASTEUR_DATA.dentalSpecialties.map((s) => `
        <div class="card-bordered p-6 hover:border-teal-500">
          <span class="text-3xl">${s.emoji}</span>
          <h2 class="font-bold text-lg mt-3">${s.name}</h2>
          <p class="text-sm text-slate-600 mt-2">${s.description}</p>
          <a href="general.html" class="inline-block mt-4 text-sm font-semibold text-teal-700 hover:underline">رزرو نوبت ←</a>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
