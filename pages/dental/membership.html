<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>طرح‌های عضویت | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-page="dental" class="flex flex-col min-h-screen font-sans antialiased">
  <div id="site-header"></div>
  <main class="flex-1 py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <nav class="text-sm text-slate-500 mb-6">
        <a href="index.html" class="hover:text-teal-700">دندانپزشکی</a>
        <span class="mx-2">/</span>
        <span class="text-slate-900 font-medium">طرح‌های عضویت</span>
      </nav>
      <div class="card-bordered p-6 sm:p-8 mb-8 bg-gradient-to-bl from-cyan-50 to-amber-50 border-cyan-200 text-center">
        <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white text-cyan-800 text-xs font-bold border border-cyan-200 mb-3">
          عضویت بیماران دندان
        </span>
        <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-950 mb-2">💎 عضویت دندانپزشکی پاستور پلاس</h1>
        <p class="text-slate-600 max-w-xl mx-auto">برای بیماران دندان فقط دو مسیر ساده داریم: عادی یا VIP. شرایط VIP را ببینید و بعد انتخاب کنید.</p>
      </div>

      <div id="membership-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div>
    </div>

    <!-- Modal -->
    <div id="membership-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
      <div class="card-bordered w-full max-w-md p-6 bg-white animate-fade-in">
        <h2 id="modal-plan-name" class="font-bold text-xl mb-4"></h2>
        <form id="membership-form" class="space-y-4">
          <div>
            <label class="form-label">نام و نام خانوادگی</label>
            <input type="text" id="member-name" class="form-input" required />
          </div>
          <div>
            <label class="form-label">شماره موبایل</label>
            <input type="tel" id="member-phone" class="form-input" required />
          </div>
          <div>
            <label class="form-label">کد معرف ویزیتور (اختیاری)</label>
            <input type="text" id="member-referral" class="form-input" placeholder="مثلاً PLUS100" />
          </div>
          <p id="modal-terms" class="text-xs text-slate-500"></p>
          <div class="flex gap-3">
            <button type="button" id="modal-close" class="flex-1 py-2.5 border-2 border-slate-200 rounded-lg">انصراف</button>
            <button type="submit" class="btn-primary flex-1">پرداخت و تأیید نهایی</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../../js/data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    let selectedPlan = null;

    document.addEventListener('DOMContentLoaded', () => {
      mountLayout('dental');
      const grid = document.getElementById('membership-grid');

      const order = ['regular', 'vip'];
      const plans = order.map((id) => PASTEUR_DATA.memberships.find((m) => m.id === id)).filter(Boolean);

      grid.innerHTML = plans.map((m) => `
        <div class="card-bordered p-6 flex flex-col ${m.highlighted ? 'card-vip ring-2 ring-amber-200 relative' : ''}">
          ${m.highlighted ? '<span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-amber-500 text-white text-xs px-3 py-1 rounded-full font-bold">ویژه بیماران VIP</span>' : ''}
          <div class="text-center mb-4">
            <span class="text-4xl">${m.id === 'vip' ? '💎' : '🧾'}</span>
            <h2 class="font-bold text-xl mt-2">${m.name}</h2>
          </div>
          <p class="text-2xl font-bold ${m.id === 'vip' ? 'text-amber-700' : 'text-teal-700'} text-center my-4">${m.price}${m.priceNum ? ' <span class="text-sm font-normal text-slate-500">تومان</span>' : ''}</p>
          <ul class="text-sm text-slate-600 space-y-2 flex-1 mb-4">
            ${m.features.map((f) => `<li class="flex gap-2"><span class="text-teal-600">✓</span>${f}</li>`).join('')}
          </ul>
          ${m.id === 'vip' ? `
            <div class="rounded-xl border-2 border-amber-200 bg-white p-4 text-sm text-slate-700 mb-4">
              <p class="font-bold text-amber-800 mb-2">شرایط VIP:</p>
              <p>بعد از پرداخت، تخفیف ۲٪ فروشگاه تجهیزات و امکان درخواست تسهیلات برای تجهیزات پزشکی فعال می‌شود.</p>
            </div>` : ''}
          <p class="text-xs text-slate-500 mb-4 border-t border-slate-100 pt-3">${m.terms}</p>
          <button type="button" data-plan="${m.id}" class="${m.id === 'vip' ? 'btn-accent' : 'btn-primary'} w-full text-sm plan-select-btn">
            ${m.priceNum ? 'پرداخت و عضویت' : 'عضویت رایگان'}
          </button>
        </div>
      `).join('');

      grid.addEventListener('click', (e) => {
        const btn = e.target.closest('.plan-select-btn');
        if (!btn) return;
        selectedPlan = PASTEUR_DATA.memberships.find((p) => p.id === btn.dataset.plan);
        if (!selectedPlan) return;

        if (selectedPlan.priceNum === 0) {
          PasteurStorage.saveMember({
            id: PasteurStorage.generateId(),
            planId: selectedPlan.id,
            planName: selectedPlan.name,
            patientName: 'عضو جدید',
            patientPhone: '-',
            amount: 0,
            status: 'paid',
            createdAt: new Date().toISOString(),
          });
          alert('عضویت رایگان با موفقیت فعال شد!');
          return;
        }

        document.getElementById('modal-plan-name').textContent = `عضویت ${selectedPlan.name}`;
        document.getElementById('modal-terms').textContent = selectedPlan.terms;
        document.getElementById('membership-modal').classList.remove('hidden');
      });

      document.getElementById('modal-close').addEventListener('click', () => {
        document.getElementById('membership-modal').classList.add('hidden');
      });

      document.getElementById('membership-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('member-name').value.trim();
        const phone = document.getElementById('member-phone').value.trim();
        if (name.length < 2 || phone.replace(/[^\d]/g, '').length < 10) {
          alert('اطلاعات را کامل وارد کنید.');
          return;
        }
        PasteurStorage.setPendingPayment({
          kind: 'membership',
          planId: selectedPlan.id,
          planName: selectedPlan.name,
          patientName: name,
          patientPhone: phone,
          amount: selectedPlan.priceNum,
          referralCode: document.getElementById('member-referral').value.trim().toUpperCase(),
        });
        window.location.href = 'confirm.html';
      });
    });
  </script>
</body>
</html>
