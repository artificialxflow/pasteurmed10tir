<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رزرو نوبت | موسسه پاستور</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-page="dental" class="flex flex-col min-h-screen font-sans antialiased">
  <div id="site-header"></div>
  <main class="flex-1 py-8 sm:py-10">
    <div class="max-w-2xl mx-auto px-4 sm:px-6" id="booking-app">
      <nav class="text-sm text-slate-500 mb-4">
        <a href="general.html" class="hover:text-teal-700">دندانپزشکان</a>
        <span class="mx-2">/</span>
        <span class="text-slate-900 font-medium">رزرو نوبت</span>
      </nav>

      <h1 class="text-2xl font-bold text-slate-900 mb-1">رزرو نوبت دندانپزشکی</h1>
      <p class="text-slate-600 mb-6">انتخاب نوع خدمت: ویزیت یا شروع درمان؟</p>

      <div id="selected-doctor-info" class="hidden"></div>

      <div id="booking-progress" class="flex items-center mb-8 overflow-x-auto pb-2"></div>

      <div id="booking-error" class="hidden mb-4 p-3 text-sm text-red-700 bg-red-50 border-2 border-red-200 rounded-lg"></div>

      <!-- Step: Type -->
      <div id="step-type" class="booking-step">
        <div id="type-options" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </div>

      <!-- Step: Doctor -->
      <div id="step-doctor" class="booking-step hidden">
        <p class="text-sm text-slate-600 mb-4">پزشک مورد نظر را انتخاب کنید:</p>
        <div id="doctor-list" class="space-y-3"></div>
      </div>

      <!-- Step: Day -->
      <div id="step-day" class="booking-step hidden">
        <p class="text-sm text-slate-600 mb-4">روز حضور پزشک را انتخاب کنید:</p>
        <div id="day-options" class="flex flex-wrap gap-3"></div>
      </div>

      <!-- Step: Time -->
      <div id="step-time" class="booking-step hidden">
        <p id="time-hint" class="text-sm text-teal-700 bg-teal-50 border border-teal-200 rounded-lg p-3 mb-4"></p>
        <div id="time-options" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
      </div>

      <!-- Step: Info -->
      <div id="step-info" class="booking-step hidden">
        <div id="booking-summary" class="mb-6"></div>
        <form id="booking-form" class="space-y-4">
          <div>
            <label for="patient-name" class="form-label">نام و نام خانوادگی</label>
            <input type="text" id="patient-name" class="form-input" placeholder="مثال: علی احمدی" required />
          </div>
          <div>
            <label for="patient-phone" class="form-label">شماره موبایل</label>
            <input type="tel" id="patient-phone" class="form-input" placeholder="۰۹۱۲۱۲۳۴۵۶۷" required />
          </div>
          <button type="submit" id="btn-submit" class="btn-primary w-full hidden">
            ادامه و تأیید نهایی
          </button>
        </form>
      </div>

      <div class="flex gap-3 mt-8">
        <button type="button" id="btn-back" class="px-5 py-2.5 rounded-lg border-2 border-slate-200 text-slate-700 font-medium hover:bg-slate-50">
          قبلی
        </button>
        <button type="button" id="btn-next" class="btn-primary flex-1">مرحله بعد</button>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../../js/data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/booking.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountLayout('dental');
      BookingFlow.init();
    });
  </script>
</body>
</html>
