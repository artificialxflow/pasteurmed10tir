<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>گالری نتایج | موسسه پاستور</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body data-page="gallery" class="flex flex-col min-h-screen font-sans antialiased">
  <div id="site-header"></div>
  <main class="flex-1 py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">🖼️ گالری نتایج</h1>
      <p class="text-slate-600 mb-6">نمونه‌کارهای قبل و بعد — دندانپزشکی، لیزر و زیبایی</p>

      <div id="gallery-filters" class="flex flex-wrap gap-2 mb-8"></div>
      <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <div id="lightbox" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
      <div class="bg-white rounded-xl max-w-3xl w-full p-4 sm:p-6 relative animate-fade-in">
        <button id="lightbox-close" class="absolute top-3 left-3 w-8 h-8 rounded-full bg-slate-100 text-slate-700 font-bold">✕</button>
        <h3 id="lightbox-title" class="font-bold text-lg mb-4 text-center"></h3>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <p class="text-xs text-center text-slate-500 mb-2">قبل</p>
            <img id="lightbox-before" class="w-full h-48 object-cover rounded-lg border-2 border-slate-200" alt="قبل" />
          </div>
          <div>
            <p class="text-xs text-center text-slate-500 mb-2">بعد</p>
            <img id="lightbox-after" class="w-full h-48 object-cover rounded-lg border-2 border-teal-300" alt="بعد" />
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/components.js"></script>
  <script>
    function renderGallery(cat = 'all') {
      PasteurStorage.initGalleryIfNeeded();
      let items = PasteurStorage.getGallery();
      if (cat !== 'all') items = items.filter((g) => g.category === cat);

      const catLabels = { dental: 'دندانپزشکی', laser: 'لیزر', beauty: 'زیبایی' };
      document.getElementById('gallery-grid').innerHTML = items.length ? items.map((g) => `
        <article class="gallery-card card-bordered overflow-hidden cursor-pointer hover:border-teal-500" data-id="${g.id}">
          <div class="grid grid-cols-2 gap-0.5">
            <img src="${g.before}" alt="قبل" class="h-32 object-cover" loading="lazy" />
            <img src="${g.after}" alt="بعد" class="h-32 object-cover" loading="lazy" />
          </div>
          <div class="p-4">
            <span class="text-xs text-teal-700 font-medium">${catLabels[g.category] || g.category}</span>
            <h3 class="font-bold">${g.title}</h3>
            <p class="text-xs text-slate-500 mt-1">کلیک برای بزرگنمایی</p>
          </div>
        </article>
      `).join('') : '<p class="col-span-full text-center text-slate-500 py-8">موردی یافت نشد.</p>';
    }

    document.addEventListener('DOMContentLoaded', () => {
      mountLayout('gallery');

      document.getElementById('gallery-filters').innerHTML = PASTEUR_DATA.galleryCategories.map((c, i) => `
        <button data-cat="${c.id}" class="gallery-filter badge ${i === 0 ? 'badge-available' : 'bg-slate-100 text-slate-700 border-slate-300'} cursor-pointer">${c.label}</button>
      `).join('');

      renderGallery();

      document.getElementById('gallery-filters').addEventListener('click', (e) => {
        const btn = e.target.closest('.gallery-filter');
        if (!btn) return;
        document.querySelectorAll('.gallery-filter').forEach((b) => {
          b.className = 'gallery-filter badge bg-slate-100 text-slate-700 border-slate-300 cursor-pointer';
        });
        btn.className = 'gallery-filter badge badge-available cursor-pointer';
        renderGallery(btn.dataset.cat);
      });

      document.getElementById('gallery-grid').addEventListener('click', (e) => {
        const card = e.target.closest('.gallery-card');
        if (!card) return;
        const item = PasteurStorage.getGallery().find((g) => g.id === parseInt(card.dataset.id, 10));
        if (!item) return;
        document.getElementById('lightbox-title').textContent = item.title;
        document.getElementById('lightbox-before').src = item.before;
        document.getElementById('lightbox-after').src = item.after;
        document.getElementById('lightbox').classList.remove('hidden');
      });

      document.getElementById('lightbox-close').addEventListener('click', () => {
        document.getElementById('lightbox').classList.add('hidden');
      });
      document.getElementById('lightbox').addEventListener('click', (e) => {
        if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.add('hidden');
      });
    });
  </script>
</body>
</html>
