<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لیزر و زیبایی | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body data-page="laser" class="flex flex-col min-h-screen font-sans antialiased">
  <div id="site-header"></div>
  <main class="flex-1 py-10">
    <div class="max-w-4xl mx-auto px-4 sm:px-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">✨ لیزر و زیبایی</h1>
      <p class="text-slate-600 mb-8">خدمات لیزر و زیبایی با جدیدترین تجهیزات</p>
      <div id="laser-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
      <div class="mt-8 card-bordered p-6 text-center bg-purple-50 border-purple-200">
        <p class="mb-4 text-slate-700">برای مشاوره رایگان و رزرو نوبت تماس بگیرید</p>
        <a id="laser-call" href="#" class="btn-accent">رزرو مشاوره</a>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/data.js"></script>
  <script src="../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountLayout('laser');
      document.getElementById('laser-grid').innerHTML = PASTEUR_DATA.laserServices.map((s) => `
        <div class="card-bordered p-6 hover:border-purple-400">
          <span class="text-3xl">${s.emoji}</span>
          <h2 class="font-bold text-lg mt-3">${s.title}</h2>
          <p class="text-purple-700 font-semibold mt-2">${s.price}</p>
        </div>
      `).join('');
      document.getElementById('laser-call').href = `tel:${PASTEUR_DATA.institute.phoneDigits}`;
    });
  </script>
</body>
</html>
