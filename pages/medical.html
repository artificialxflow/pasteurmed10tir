<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پزشکی | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body data-page="medical" class="flex flex-col min-h-screen font-sans antialiased">
  <div id="site-header"></div>
  <main class="flex-1 py-10">
    <div class="max-w-4xl mx-auto px-4 sm:px-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">🩺 بخش پزشکی</h1>
      <p class="text-slate-600 mb-8">ویزیت و مشاوره با پزشکان مجرب پاستور پلاس</p>
      <div id="physicians-list" class="space-y-4"></div>
      <div class="mt-8 card-bordered p-6 bg-blue-50 border-blue-200 text-center">
        <p class="text-slate-700 mb-4">برای رزرو نوبت پزشکی با مرکز تماس بگیرید یا از بخش دندانپزشکی استفاده کنید.</p>
        <a href="tel:04133334444" class="btn-accent">📞 تماس: ۰۴۱-۳۳۳۳۴۴۴۴</a>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/data.js"></script>
  <script src="../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountLayout('medical');
      document.getElementById('physicians-list').innerHTML = PASTEUR_DATA.physicians.map((p) => {
        const st = STATUS_LABELS[p.status];
        return `
        <article class="card-bordered p-5 flex items-center gap-4">
          <img src="${p.image}" class="w-20 h-20 rounded-xl object-cover border-2 border-slate-200" alt="" />
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <h3 class="font-bold">${p.name}</h3>
              <span class="badge ${st.class}">${st.text}</span>
            </div>
            <p class="text-sm text-blue-700">${p.specialty}</p>
            <p class="text-xs text-slate-500 mt-1">📅 ${p.days.join('، ')}</p>
          </div>
        </article>`;
      }).join('');
    });
  </script>
</body>
</html>
