<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پزشکی | پاستور پلاس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body data-page="medical" class="flex flex-col min-h-screen font-sans antialiased">
  <div id="site-header"></div>
  <main class="flex-1 py-10">
    <div class="max-w-4xl mx-auto px-4 sm:px-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">🩺 بخش پزشکی</h1>
      <p class="text-slate-600 mb-8">در بخش پزشکی، مشاوره و ویزیت آنلاین را انتخاب و درخواست خود را ثبت کنید.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <a href="consultation.html?category=medical&type=text" class="card-bordered p-6 hover:-translate-y-1 transition-transform">
          <span class="text-4xl">💬</span>
          <h2 class="font-bold text-lg mt-3 text-slate-900">مشاوره آنلاین پزشکی</h2>
          <p class="text-sm text-slate-600 mt-2">شرح مشکل را ثبت کنید تا کارشناسان پاستور پلاس آنلاین پیگیری کنند.</p>
          <span class="btn-primary mt-5 inline-flex text-sm">ثبت مشاوره آنلاین</span>
        </a>
        <a href="consultation.html?category=medical&type=video" class="card-bordered p-6 hover:-translate-y-1 transition-transform">
          <span class="text-4xl">🎥</span>
          <h2 class="font-bold text-lg mt-3 text-slate-900">ویزیت آنلاین پزشکی</h2>
          <p class="text-sm text-slate-600 mt-2">برای ویزیت آنلاین، اطلاعات و شرح وضعیت بیمار را ارسال کنید.</p>
          <span class="btn-accent mt-5 inline-flex text-sm">ثبت ویزیت آنلاین</span>
        </a>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/data.js"></script>
  <script src="../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountLayout('medical');
    });
  </script>
</body>
</html>
